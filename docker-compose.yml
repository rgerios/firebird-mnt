services:
  inframgnt:
    build:
      context: .
      dockerfile: Dockerfile
    image: inframgnt:latest
    container_name: inframgnt-server
    restart: unless-stopped
    ports:
      - "${INFRAMGNT_PORT:-8000}:8000"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - INFRAMGNT_ADMIN_USER=${INFRAMGNT_ADMIN_USER:-admin}
      - INFRAMGNT_ADMIN_PASSWORD=${INFRAMGNT_ADMIN_PASSWORD:-Venosan@2026}
      - INFRAMGNT_SECRET_KEY=${INFRAMGNT_SECRET_KEY:-venosan-inframgnt-proxmox-secret-key-2026}
    volumes:
      # Persistência do banco SQLite, logs de auditoria e par de chaves SSH do container
      - ./backend/data:/app/backend/data
      # (Opcional) Se quiser importar chaves SSH do host Linux com ajuste automático de permissão:
      # - ~/.ssh:/root/.ssh-host:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
