  <text x="280" y="416" font-family="monospace" font-size="10" font-weight="700" fill="#bae6fd">job_reindex_stats</text>
  <rect x="372" y="403" width="54" height="16" rx="8" fill="#0c4a6e"/>
  <text x="399" y="414" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#bae6fd" text-anchor="middle">MÍNIMO</text>
  <text x="280" y="440" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Recalcular Índices</text>
