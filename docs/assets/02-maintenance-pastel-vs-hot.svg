  <text x="280" y="475" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">isql sem travar tabelas.</text>
  <text x="280" y="532" font-family="Inter, sans-serif" font-size="10" fill="#bae6fd">Exige Parada? Não (100% Online)</text>
  <rect x="280" y="544" width="184" height="28" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#7dd3fc"/>
  <text x="372" y="562" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe" text-anchor="middle">Recalcular Índices Online</text>

  <!-- Card 3: Pastel Lavender -->
  <rect x="492" y="394" width="212" height="190" rx="14" fill="url(#violetManage)" stroke="#c4b5fd" stroke-opacity="0.45"/>
  <text x="506" y="416" font-family="monospace" font-size="10" font-weight="700" fill="#ddd6fe">job_linux_patches</text>
  <rect x="600" y="403" width="52" height="16" rx="8" fill="#2e1065"/>
  <text x="626" y="414" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#ddd6fe" text-anchor="middle">SO LINUX</text>
  <text x="506" y="440" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Tuning &amp; Patches Linux</text>
  <text x="506" y="460" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">Audita noatime, swappiness=10,</text>
  <text x="506" y="475" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">fstrim.timer e hold firebird*.</text>
  <text x="506" y="532" font-family="Inter, sans-serif" font-size="10" fill="#ddd6fe">Exige Parada? Não (Online)</text>
  <rect x="506" y="544" width="184" height="28" rx="8" fill="#7c3aed" fill-opacity="0.25" stroke="#c4b5fd"/>
  <text x="598" y="562" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ede9fe" text-anchor="middle">Auditar / Otimizar Linux</text>

  <!-- Card 4: Warm Amber (Medium I/O) -->
  <rect x="718" y="394" width="212" height="190" rx="14" fill="url(#amberIo)" stroke="#f97316" stroke-width="1.5"/>
  <text x="732" y="416" font-family="monospace" font-size="10" font-weight="700" fill="#fdba74">job_clean_sweep</text>
  <rect x="822" y="403" width="60" height="16" rx="8" fill="#7c2d12"/>
  <text x="852" y="414" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#fed7aa" text-anchor="middle">ALTO I/O</text>
  <text x="732" y="440" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffedd5">Sweep Manual (gfix)</text>
  <text x="732" y="460" font-family="Inter, sans-serif" font-size="10" fill="#fed7aa">Limpa backversions antigas</text>
  <text x="732" y="475" font-family="Inter, sans-serif" font-size="10" fill="#fed7aa">e avança OIT. Alto uso disco.</text>
  <text x="732" y="532" font-family="Inter, sans-serif" font-size="10" fill="#fb923c">Recomendado: Fora do Pico</text>
  <rect x="732" y="544" width="184" height="28" rx="8" fill="#ea580c" fill-opacity="0.35" stroke="#fb923c"/>
  <text x="824" y="562" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffedd5" text-anchor="middle">Executar gfix -sweep</text>

  <!-- Card 5: HOT CRIMSON (Critical Downtime) -->
  <rect x="944" y="394" width="216" height="190" rx="14" fill="url(#crimsonHot)" stroke="#ef4444" stroke-width="2"/>
  <text x="958" y="416" font-family="monospace" font-size="10" font-weight="700" fill="#fca5a5">job_full_rebuild</text>
  <rect x="1044" y="402" width="102" height="18" rx="9" fill="#ef4444"/>
  <text x="1095" y="414" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">CRÍTICO • PARADA</text>
  <text x="958" y="440" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#ffe4e6">Ciclo Rebuild Completo</text>
  <text x="958" y="460" font-family="Inter, sans-serif" font-size="10" fill="#fecdd3">gfix -shut full &rarr; gbak -b &rarr;</text>
  <text x="958" y="475" font-family="Inter, sans-serif" font-size="10" fill="#fecdd3">gbak -c &rarr; gfix -online.</text>
  <rect x="958" y="490" width="188" height="22" rx="6" fill="#450a0a" stroke="#f87171"/>
  <text x="968" y="505" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fecaca">☑ Autorizar Parada (Shutdown)</text>
  <text x="958" y="532" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#f87171">Exige Parada? SIM (Derruba ERP)</text>
  <rect x="958" y="544" width="188" height="28" rx="8" fill="#dc2626"/>
  <text x="1052" y="562" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">⚠️ Executar Full Rebuild</text>
</svg>
